<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İsim Zinciri</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f5e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#1c1b19; --muted:#8a857c; --line:#e6e1d6;
    --accent:#2f6f5e; --accent-d:#245849; --accent-2:#e7f0ec; --seg-a:#2f6f5e; --seg-b:#3d8a75;
    --used:#dcd7cc; --red:#d64541; --red-bg:#fdecea; --gold:#e8b630;
    --w:min(72vw, 34dvh, 340px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);overflow:hidden;
       background:radial-gradient(120% 70% at 50% -10%, #e3eee8 0%, rgba(227,238,232,0) 60%), var(--bg);
       padding:max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left))}
  .app{height:100%;width:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .stage{display:flex;flex-direction:column;gap:12px}

  /* Başlık */
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(170deg,#3a8670,#1c483c);display:grid;place-items:center;box-shadow:0 4px 12px rgba(47,111,94,.25)}
  .logo svg{width:30px;height:30px}
  h1{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
  .brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .reset{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--ink);
         font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
  .reset svg{width:15px;height:15px}

  /* Dil seçimi */
  .langs{display:flex;padding:4px;background:#e9e4d9;border-radius:14px;gap:4px}
  .lang{flex:1;border:none;background:transparent;font:inherit;font-size:14px;font-weight:600;color:#6d685f;
        padding:9px 6px;border-radius:10px;cursor:pointer;transition:all .25s}
  .lang.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}

  /* Çark */
  .wheel-area{display:grid;place-items:center;padding:calc(var(--w) * .11) 0 calc(var(--w) * .04)}
  .wheel-wrap{position:relative;width:var(--w);aspect-ratio:1}
  .wheel-wrap::before{content:"";position:absolute;inset:-4.5%;border-radius:50%;
       background:linear-gradient(160deg,#ffffff,#ece6da);box-shadow:0 18px 40px rgba(47,111,94,.18), inset 0 1px 0 #fff}
  .wheel-wrap::after{content:"";position:absolute;inset:-4.5%;border-radius:50%;
       background:repeating-conic-gradient(from 0deg, rgba(47,111,94,.35) 0 1.2deg, transparent 1.2deg 10deg);
       -webkit-mask:radial-gradient(circle, transparent 66%, #000 67%, #000 69.5%, transparent 70%);
               mask:radial-gradient(circle, transparent 66%, #000 67%, #000 69.5%, transparent 70%);opacity:.0}
  #wheel{position:relative;width:100%;height:100%;transition:transform 4.6s cubic-bezier(.15,.75,.12,1)}
  .pointer{position:absolute;top:-9%;left:50%;transform:translateX(-50%);width:12%;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  .pointer svg{display:block;width:100%;height:auto}
  .hub{position:absolute;inset:0;margin:auto;width:27%;height:27%;border-radius:50%;background:#fff;z-index:2;
       display:flex;align-items:center;justify-content:center;font-size:calc(var(--w) * .135);font-weight:800;color:var(--accent);
       box-shadow:0 0 0 calc(var(--w) * .018) rgba(255,255,255,.55), 0 6px 18px rgba(0,0,0,.18);transition:transform .3s}
  .hub.pop{transform:scale(1.15)}

  .info{align-self:center;color:var(--muted);font-size:12.5px;font-weight:500;background:rgba(255,255,255,.65);
        border:1px solid var(--line);padding:5px 12px;border-radius:999px}
  .row{display:flex;gap:10px}
  .btn{flex:1;border:none;font:inherit;font-size:16px;font-weight:700;padding:15px;border-radius:16px;cursor:pointer;
       display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .1s, opacity .2s, background .2s}
  .btn svg{width:19px;height:19px}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;cursor:default}
  .spin{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(28,27,25,.18)}
  .mic{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(47,111,94,.28)}
  .mic.live{background:var(--red);box-shadow:0 6px 16px rgba(214,69,65,.3)}
  .dot{width:10px;height:10px;border-radius:50%;background:#fff}
  .mic.live .dot{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}

  /* İsim listesi kartı */
  .list-card{flex:1;min-height:230px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.05)}
  .list-card ol, .list-card .empty{flex:0 1 auto}
  .scroll{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px;-webkit-overflow-scrolling:touch}
  .badge{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-2);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}

  /* Büyük ekran: iki sütun */
  @media (min-width: 820px){
    :root{ --w:min(38vw, 56dvh, 600px); }
    body{padding:max(24px, env(safe-area-inset-top)) 28px 24px}
    .app{max-width:1400px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(340px,.9fr);gap:28px;align-items:stretch}
    .stage{justify-content:center;gap:16px;min-height:0}
    .stage .langs,.stage .row,.stage .timer,.stage .msg{width:min(100%, 560px);align-self:center}
    .stage .top{width:100%}
    h1{font-size:24px}
    .list-card{min-height:0;height:100%}
    .btn{font-size:17px;padding:17px}
  }
  @media (min-width: 820px) and (orientation: portrait){
    :root{ --w:min(70vw, 42dvh, 600px); }
    .app{display:flex;flex-direction:column;max-width:760px}
  }
  .card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line)}
  .card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .card-head b{font-size:15px}
  .next{font-size:13px;color:var(--muted)}
  .next span{color:var(--accent);font-weight:700;font-size:15px}
  ol{list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:n}
  li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--bg);
     animation:in .25s ease;counter-increment:n}
  li::before{content:counter(n);font-size:12px;color:var(--muted);min-width:16px}
  li .t{flex:1;font-size:16px;font-weight:500}
  li.rep{background:var(--red-bg)}
  li.rep .t{color:var(--red)}
  li .tag{font-size:11px;font-weight:600;color:var(--red);background:#fff;border-radius:6px;padding:2px 6px}
  li .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 2px}
  li.unk{background:#fff6dc}
  li.unk .t{color:#9a6a00}
  li .acc{font:inherit;font-size:11px;font-weight:600;color:#9a6a00;background:#fff;border:1px solid #f0d58a;border-radius:6px;padding:2px 6px;cursor:pointer}
  li.wrong{background:var(--red-bg)}
  li.wrong .t{color:var(--red)}
  li .last{color:#1f6fd1;font-weight:800;background:#e3efff;border-radius:4px;padding:0 1px;box-shadow:inset 0 -2px 0 #1f6fd1}
  li .wt{font-size:11px;font-weight:600;color:var(--red);background:#fff;border-radius:6px;padding:2px 6px;white-space:nowrap}
  li .hd{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px}
  li .ut{font-size:11px;font-weight:600;color:#9a6a00;white-space:nowrap}
  .timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden;opacity:0;transition:opacity .3s;margin-top:-6px}
  .timer.on{opacity:1}
  .timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:background .3s}
  .timer.warn i{background:var(--red)}
  .count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:9;
         font-size:150px;font-weight:700;color:var(--red);text-shadow:0 6px 24px rgba(214,69,65,.35)}
  .count.show{display:flex}
  .count span{animation:tick 1s ease-out}
  @keyframes tick{from{transform:scale(1.7);opacity:0}25%{opacity:1}to{transform:scale(1);opacity:.85}}
  .modal .big{font-size:44px;margin-bottom:4px}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
  @keyframes in{from{opacity:0;transform:translateY(-4px)}}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0}
  .interim{color:var(--muted);font-style:italic;font-size:14px;min-height:20px;margin-top:8px}
  form{display:flex;gap:8px;margin-top:12px}
  input{flex:1;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);outline:none}
  input:focus{border-color:var(--accent)}
  form button{border:none;background:var(--accent-2);color:var(--accent);font:inherit;font-weight:600;padding:0 16px;border-radius:11px;cursor:pointer}
  .msg{font-size:13px;color:var(--red);text-align:center;min-height:0}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .modal.show{display:flex}
  .modal .box{background:var(--card);border-radius:18px;padding:22px;max-width:320px;text-align:center}
  .modal p{margin:6px 0 16px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <header class="top">
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 32 32"><g transform="rotate(8 11 11)"><rect x="3" y="3" width="15" height="15" rx="4" fill="#fff"/><text x="10.5" y="15.2" text-anchor="middle" font-family="Poppins,Inter,sans-serif" font-weight="800" font-size="12" fill="#2f6f5e">A</text></g><g transform="rotate(-8 21 21)"><rect x="13.5" y="13.5" width="15" height="15" rx="4" fill="#f0be3c"/><text x="21" y="25.6" text-anchor="middle" font-family="Poppins,Inter,sans-serif" font-weight="800" font-size="12" fill="#28241e">Z</text></g></svg></span>
        <div><h1>İsim Zinciri</h1><small>Son harften devam et</small></div>
      </div>
      <button class="reset" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>Sıfırla</span></button>
    </header>

    <div class="langs" id="langs">
      <button class="lang on" data-l="tr">Türkçe</button>
      <button class="lang" data-l="az">Azərbaycan</button>
    </div>

    <div class="wheel-area">
      <div class="wheel-wrap">
        <div class="pointer"><svg viewBox="0 0 40 52"><path d="M20 51 C14 38 3 30 3 18 A17 17 0 0 1 37 18 C37 30 26 38 20 51Z" fill="#1c1b19"/><circle cx="20" cy="18" r="6.5" fill="#e8b630"/></svg></div>
        <svg id="wheel" viewBox="0 0 300 300"></svg>
        <div class="hub" id="hub">?</div>
      </div>
    </div>
    <div class="info" id="info"></div>

    <div class="row">
      <button class="btn spin" id="spinBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span id="spinLabel">Çarkı Çevir</span></button>
      <button class="btn mic" id="micBtn" disabled><span class="dot"></span><span id="micLabel">Başlat</span></button>
    </div>
    <div class="timer" id="timer"><i id="timerBar"></i></div>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card list-card">
    <div class="card-head">
      <b>Söylenen isimler<span class="badge" id="countBadge">0</span></b>
      <div class="next" id="next"></div>
    </div>
    <div class="scroll" id="scrollBox">
      <ol id="list"></ol>
      <div class="empty" id="empty">Çarkı çevir, sonra "Başlat"a bas ve isimleri söyle.</div>
    </div>
    <div class="interim" id="interim"></div>
    <div class="legend" id="legend"><span><i style="background:var(--red)"></i>Tekrar / yanlış harf</span><span><i style="background:#e8b630"></i>Listede yok</span><span><i style="background:#1f6fd1"></i>Sıradaki harf</span></div>
    <form id="form">
      <input id="input" placeholder="Ya da ismi yaz…" autocomplete="off" dir="auto">
      <button type="submit">Ekle</button>
    </form>
  </section>
</div>

<div class="count" id="count"></div>
<div class="modal" id="timeout">
  <div class="box">
    <div class="big">⏰</div>
    <b>Süre doldu!</b>
    <p id="toText">İsim bulunamadı.</p>
    <button class="btn spin" id="toBtn" style="width:100%">Devam et</button>
  </div>
</div>
<div class="modal" id="modal">
  <div class="box">
    <b>Tüm harfler kullanıldı</b>
    <p>Bu oturumdaki bütün harfler çıktı. Yeni oturum başlatılsın mı?</p>
    <div class="row">
      <button class="btn" style="background:var(--bg)" id="mNo">Vazgeç</button>
      <button class="btn spin" id="mYes">Sıfırla</button>
    </div>
  </div>
</div>

<script>
const LANGS = {
  tr: { speech:'tr-TR', locale:'tr', letters:'A B C Ç D E F G H I İ J K L M N O Ö P R S Ş T U Ü V Y Z'.split(' ') },
  az: { speech:'az-AZ', locale:'az', letters:'A B C Ç D E Ə F G H X I İ J K Q L M N O Ö P R S Ş T U Ü V Y Z'.split(' ') }
};

function spin(){
  if (spinning) return;
  const L = LANGS[lang].letters;
  const pool = L.filter(ch => !used.has(ch));
  if (!pool.length){ $('modal').classList.add('show'); return; }
  stopListening();
  spinning = true; $('spinBtn').disabled = true; $('micBtn').disabled = true;
  hub.textContent = '…';
  const pick = pool[Math.floor(Math.random()*pool.length)];
  const i = L.indexOf(pick), seg = 360/L.length;
  const center = i*seg + seg/2 + (Math.random()-.5)*seg*0.5;
  const base = rotation - (rotation % 360);
  let target = base + 360*6 + (360 - center);
  if (target - rotation < 360*5) target += 360;
  rotation = target;
  wheel.style.transform = `rotate(${rotation}deg)`;
  setTimeout(() => {
    spinning = false; current = pick; used.add(pick);
    hub.textContent = pick; hub.classList.add('pop'); setTimeout(()=>hub.classList.remove('pop'), 300);
    names = []; renderList(); drawWheel();
    $('spinBtn').disabled = false; $('micBtn').disabled = false;
    $('spinLabel').textContent = 'Yeni Harf';
  }, 4700);
}

function resetSession(){
  stopListening();
  used.clear(); current = null; names = []; hub.textContent = '?';
  $('spinLabel').textContent = 'Çarkı Çevir'; $('micBtn').disabled = true;
  $('legend').style.display = NAMESET[lang] ? 'flex' : 'none';
  drawWheel(); renderList();
}

/* ---------- Names ---------- */
const keyOf = t => t.toLocaleLowerCase(LANGS[lang].locale).trim();

/* Bir nefes = bir isim: konuşma bitince ~1,2 sn bekle, o arada söylenenleri tek isim say */
const SETTLE = 600;
let pend = [], pendT = null;
function queuePhrase(text){ pend.push(text); clearTimeout(pendT); pendT = setTimeout(flushPhrase, SETTLE); }
function bumpPhrase(){ if (pend.length){ clearTimeout(pendT); pendT = setTimeout(flushPhrase, SETTLE); } }
function flushPhrase(){ clearTimeout(pendT); pendT = null; const t = pend.join(' '); pend = []; if (t.trim()) addPhrase(t); }

function addPhrase(text){
  const words = text.replace(/['’`][a-zçğıöşüə]+/gi,'').replace(/[.,!?"“”…:;()\-]/g,' ').split(/\s+/).filter(Boolean)
    .filter(w => !isFiller(keyOf(w)));
  if (!words.length) return;
  // Uzun ve içinde hiç bilinen isim olmayan cümle = yanlış dilde duyulmuş gürültü, yazma
  if (words.length >= 3 && !words.some(w => isKnown(correct(keyOf(w))))){
    $('interim').textContent = 'Anlaşılamadı, tekrar söyle: ' + words.join(' ');
    return;
  }
  addName(words);
}
function addName(words){
  const loc = LANGS[lang].locale;
  const heardText = words.join(' ');
  let k;
  const joined = correct(keyOf(words.join('')));             // "Adı gözel" → adıgözəl, "Abdul lah" → abdullah
  if (words.length > 1 && NAMESET[lang] && NAMESET[lang].has(joined)) k = joined;
  else k = words.map(w => correct(keyOf(w))).join(' ');      // çift isim: "Mustafa Kemal"
  const pretty = k.split(' ').map(p => p.charAt(0).toLocaleUpperCase(loc) + p.slice(1)).join(' ');
  const heard = keyOf(heardText) !== k ? heardText : null;
  const exp = expectedLetter();
  const wrong = !!exp && firstChar(k) !== exp;
  names.push({ text: pretty, key: k, rep: !wrong && names.some(n => !n.wrong && fold(n.key) === fold(k)), unk: !isKnown(k), wrong, exp, heard });
  if (wrong && navigator.vibrate) navigator.vibrate([80,60,80]);
  renderList();
  $('timeout').classList.remove('show');
  if (listening && !wrong) timerStart();
  if (names[names.length-1].rep && navigator.vibrate) navigator.vibrate(120);
}
function removeName(i){ names.splice(i,1); recompute(); }
/* Zinciri baştan hesapla: listede olmayan ve yanlış harfli isimler zinciri ilerletmez */
function recompute(){
  const seen = new Set();
  let exp = current || '';
  names.forEach(n => {
    const f = fold(n.key);
    n.unk = !isKnown(n.key);
    n.wrong = !!exp && firstChar(n.key) !== exp; n.exp = exp;
    n.rep = !n.wrong && seen.has(f);
    if (!n.wrong && !n.unk){ seen.add(f); exp = [...n.key].pop().toLocaleUpperCase(LANGS[lang].locale); }
  });
  renderList();
}
function firstChar(k){ return [...k][0].toLocaleUpperCase(LANGS[lang].locale); }
function expectedLetter(){
  const ok = names.filter(n => !n.wrong && !n.unk);
  const last = ok[ok.length-1];
  return last ? [...last.key].pop().toLocaleUpperCase(LANGS[lang].locale) : (current || '');
}
function nextLetter(){ return expectedLetter(); }
function _oldNextLetter(){
  const last = names[names.length-1];
  return last ? [...last.key].pop().toLocaleUpperCase(LANGS[lang].locale) : (current || '');
}
function nameHtml(n){
  const ch = [...n.text].map(c => c.replace(/</g,'&lt;'));
  if (n.wrong || n.rep || n.unk || ch.length < 2) return ch.join('');
  return ch.slice(0,-1).join('') + `<span class="last">${ch[ch.length-1]}</span>`;
}
function renderList(){
  const ol = $('list');
  ol.innerHTML = names.map((n,i) =>
    `<li class="${n.wrong?'wrong':(n.rep?'rep':(n.unk?'unk':''))}"><span class="t" dir="auto">${nameHtml(n)}${n.heard?`<small class="hd">duyulan: ${n.heard.replace(/</g,'&lt;')}</small>`:''}</span>${n.wrong?`<span class="wt">Yanlış harf · ${n.exp} olmalı</span>`:n.rep?'<span class="tag">Tekrar</span>':(n.unk?`<span class="ut">Listede yok</span><button class="acc" data-a="${i}">+ Listeye ekle</button>`:'')}<button class="x" data-i="${i}" aria-label="Sil">×</button></li>`
  ).join('');
  $('empty').style.display = names.length ? 'none' : 'block';
  $('countBadge').textContent = names.filter(n => !n.wrong && !n.unk && !n.rep).length;
  const last = names[names.length-1];
  if (last){
    $('next').innerHTML = `Sıradaki harf: <span>${nextLetter()}</span>`;
  } else {
    $('next').innerHTML = current ? `Başlangıç: <span>${current}</span>` : '';
  }
  const sb = $('scrollBox'); sb.scrollTo({top: sb.scrollHeight, behavior:'smooth'});
}

/* ---------- Süre: 3 sn tolerans + 10 sn, son 5 sn geri sayım ---------- */
const GRACE = 3000, LIMIT = 10000;
let tStart = 0, tRaf = null, tLastSec = null;
function hideCount(){ $('count').classList.remove('show'); $('count').innerHTML = ''; }
function timerStart(){
  tStart = performance.now(); tLastSec = null;
  $('timer').classList.add('on'); hideCount();
  if (!tRaf) tRaf = requestAnimationFrame(tick);
}
function timerStop(){
  if (tRaf) cancelAnimationFrame(tRaf); tRaf = null;
  $('timer').classList.remove('on','warn'); hideCount();
}
function tick(now){
  const el = now - tStart, remain = GRACE + LIMIT - el;
  $('timerBar').style.transform = `scaleX(${el < GRACE ? 1 : Math.max(0, remain/LIMIT)})`;
  $('timer').classList.toggle('warn', remain <= 5000);
  if (remain <= 5000 && remain > 0){
    const sec = Math.ceil(remain/1000);
    if (sec !== tLastSec){
      tLastSec = sec; $('count').innerHTML = `<span>${sec}</span>`; $('count').classList.add('show');
      if (navigator.vibrate) navigator.vibrate(40);
    }
  }
  if (remain <= 0){ tRaf = null; timeUp(); return; }
  tRaf = requestAnimationFrame(tick);
}
function timeUp(){
  hideCount(); $('timer').classList.remove('warn');
  const ch = nextLetter();
  $('toText').innerHTML = ch ? `<b>${ch}</b> harfiyle isim bulunamadı 😅` : 'İsim bulunamadı 😅';
  $('timeout').classList.add('show');
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
}
$('toBtn').onclick = () => { $('timeout').classList.remove('show'); if (listening) timerStart(); };

/* ---------- Speech ---------- */
let listening = false, rec = null, dict = null, engine = null, dictFallback = {}, micLang = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const inClaude = typeof window.claude !== 'undefined';

if (inClaude && window.claude.use){
  window.claude.use('dictation').then(d => {
    if (!d) return;
    dict = d;
    d.onPartial(({text}) => { $('interim').textContent = text; if (text) bumpPhrase(); });
    d.onFinal(({text}) => { $('interim').textContent = ''; queuePhrase(text); });
    d.onState(({state}) => { if (state === 'idle' && engine === 'dict') setListening(false); });
  }).catch(()=>{});
}

function setListening(on){
  listening = on;
  $('micBtn').classList.toggle('live', on);
  $('micLabel').textContent = on ? 'Durdur' : 'Başlat';
  if (!on) micLang = null; drawWheel();
  if (on) timerStart(); else { $('interim').textContent = ''; engine = null; timerStop(); $('timeout').classList.remove('show'); }
}

/* Google birkaç tahmin verir: listede olan ve beklenen harfle başlayanı seç */
function bestAlt(alts){
  const exp = expectedLetter();
  let best = alts[0], bs = -1;
  alts.forEach((t, i) => {
    const w = t.split(/\s+/).filter(Boolean).map(x => correct(keyOf(x))).filter(x => !isFiller(x));
    if (!w.length) return;
    let sc = w.filter(x => isKnown(x)).length * 2 + (exp && firstChar(w[0]) === exp ? 3 : 0) - i * 0.1;
    if (sc > bs){ bs = sc; best = t; }
  });
  return best;
}
/* Android Chrome "bitti" sinyali vermeyebilir: kelime 0,7 sn değişmezse kendimiz kesinleştiriyoruz */
let webIgnore = false, webIdleT = null, webLast = '';
function startWebSpeech(){
  rec = new SR();
  rec.lang = LANGS[lang].speech; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 5;
  rec.onresult = e => {
    if (webIgnore) return;
    let interim = '', finals = [], lastAlts = null;
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) finals.push(bestAlt([...r].map(a => a.transcript)));
      else { interim += r[0].transcript; lastAlts = [...r].map(a => a.transcript); }
    }
    if (finals.length){
      clearTimeout(webIdleT); webLast = '';
      finals.forEach(f => queuePhrase(f));
    }
    $('interim').textContent = interim;
    if (interim){
      bumpPhrase();
      if (interim !== webLast){
        webLast = interim; clearTimeout(webIdleT);
        const alts = (lastAlts && e.results.length - e.resultIndex === 1) ? lastAlts : [interim];
        webIdleT = setTimeout(() => {
          webIgnore = true; webLast = '';
          $('interim').textContent = '';
          pend.push(bestAlt(alts)); flushPhrase();
          try { rec.abort(); } catch(_){}
        }, 700);
      }
    }
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      setListening(false);
      $('msg').textContent = 'Mikrofon izni verilmedi. İsimleri aşağıya yazabilirsin.';
    }
  };
  rec.onend = () => {
    clearTimeout(webIdleT); webLast = ''; webIgnore = false;
    if (listening && engine === 'web') { try { rec.start(); } catch(_){} }
  };
  webIgnore = false;
  rec.start(); engine = 'web'; micLang = LANGS[lang].locale; setListening(true);
}

function startListening(){
  $('msg').textContent = '';
  if (inClaude && dict){
    engine = 'dict'; setListening(true);
    // Claude'un ses tanıması Azerbaycancayı düzgün tanımıyor; Türkçe tanıma şiveye en yakını.
    // Duyulan isim sonra Azerbaycan listesine göre doğru yazılışa çevriliyor.
    const useLang = 'tr';
    dict.start({ language: useLang }).then(() => { micLang = useLang; drawWheel(); }).catch(err => {
      setListening(false);
      const code = err && err.code;
      if (code === 'unavailable' && useLang === 'az'){
        dictFallback.az = 'tr';
        $('msg').textContent = 'Azərbaycan dili burada desteklenmiyor. Türkçe tanımayla devam etmek için tekrar "Başlat"a bas.';
      } else if (code === 'not_granted'){
        $('msg').textContent = 'Mikrofon izni verilmedi. İsimleri aşağıya yazabilirsin.';
      } else if (code !== 'stopped'){
        $('msg').textContent = 'Mikrofon şu an kullanılamıyor. Tekrar dene ya da isimleri aşağıya yaz.';
      }
    });
    return;
  }
  if (SR && !inClaude){ try { startWebSpeech(); return; } catch(_){} }
  $('msg').textContent = 'Bu tarayıcıda ses tanıma yok. Chrome ile aç ya da isimleri aşağıya yaz.';
}
function stopListening(){
  flushPhrase();
  if (!listening) return;
  if (engine === 'web' && rec){ listening = false; clearTimeout(webIdleT); try { rec.abort(); } catch(_){} }
  if (engine === 'dict' && dict){ dict.stop().catch(()=>{}); }
  setListening(false);
}

/* ---------- Events ---------- */
$('spinBtn').onclick = spin;
$('micBtn').onclick = () => listening ? stopListening() : startListening();
$('resetBtn').onclick = resetSession;
$('mYes').onclick = () => { $('modal').classList.remove('show'); resetSession(); };
$('mNo').onclick = () => $('modal').classList.remove('show');
$('list').onclick = e => { const b = e.target.closest('.x'); if (b) return removeName(+b.dataset.i); const a = e.target.closest('.acc'); if (a) acceptName(+a.dataset.a); };
$('form').onsubmit = e => { e.preventDefault(); const v = $('input').value; if (v.trim()){ addPhrase(v); $('input').value=''; } };
$('langs').onclick = e => {
  const b = e.target.closest('.lang'); if (!b || spinning) return;
  document.querySelectorAll('.lang').forEach(x => x.classList.toggle('on', x === b));
  lang = b.dataset.l; resetSession();
};

drawWheel(); renderList();
// Uygulama olarak kurulabilmesi için (Claude içinde çalışmaz, sorun değil)
if ('serviceWorker' in navigator && !inClaude){ try { navigator.serviceWorker.register('sw.js').catch(()=>{}); } catch(_){} }
</script>
